<body class="dynamic-bg">
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState } = React;

    const BusinessCard = ({ onLogout }) => {
      return (
        <div className="flex flex-col items-center justify-center min-h-screen p-4">
          <div className="relative w-full max-w-2xl bg-white bg-opacity-80 p-8 rounded-xl shadow-lg border border-gray-200 overflow-hidden text-center animate-fade-in-down">
            <h1 className="text-4xl font-bold text-red-800 mb-4 tracking-wide font-sans animate-fade-in-down">
              HAIR SERVICES
            </h1>
            <p className="text-sm text-gray-600 mb-8 leading-relaxed animate-fade-in-up">
              KGP complex, 10/3, Bodipalayam Rd, Settipalayam, Malumichampatti, Coimbatore, Tamilnadu - 641021
            </p>
            <ul className="text-left mb-8 space-y-2 text-gray-800 font-medium columns-1 sm:columns-2 gap-x-8">
              <li className="flex items-center space-x-2 opacity-0 animate-fade-in-right animation-delay-300">
                <span className="text-red-600 font-extrabold text-xl">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                </span>
                <span>FEMALE HAIR SERVICES</span>
              </li>
              <li className="flex items-center space-x-2 opacity-0 animate-fade-in-right animation-delay-400">
                <span className="text-red-600 font-extrabold text-xl">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                </span>
                <span>MEN HAIR SERVICES</span>
              </li>
              <li className="flex items-center space-x-2 opacity-0 animate-fade-in-right animation-delay-500">
                <span className="text-red-600 font-extrabold text-xl">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                </span>
                <span>DE-TAN / FACIAL</span>
              </li>
              <li className="flex items-center space-x-2 opacity-0 animate-fade-in-right animation-delay-600">
                <span className="text-red-600 font-extrabold text-xl">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                </span>
                <span>HAIR SPA</span>
              </li>
              <li className="flex items-center space-x-2 opacity-0 animate-fade-in-right animation-delay-700">
                <span className="text-red-600 font-extrabold text-xl">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                </span>
                <span>KERATIN TREATMENT</span>
              </li>
              <li className="flex items-center space-x-2 opacity-0 animate-fade-in-right animation-delay-800">
                <span className="text-red-600 font-extrabold text-xl">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                </span>
                <span>BOTOX TREATMENT</span>
              </li>
              <li className="flex items-center space-x-2 opacity-0 animate-fade-in-right animation-delay-900">
                <span className="text-red-600 font-extrabold text-xl">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>
                </span>
                <span>SMOOTHENING & STRAIGHTENING</span>
              </li>
            </ul>
            <div className="absolute top-4 right-4 bg-red-800 text-white rounded-full w-28 h-28 flex flex-col items-center justify-center font-bold text-lg p-2 animate-bounce-in transform-gpu origin-center">
              <span className="text-xs">FIRST TIME VISIT GET</span>
              <span className="text-3xl">50%</span>
              <span className="text-xs">OFFER!</span>
            </div>
            <div className="mt-8">
              <button
                onClick={onLogout}
                className="inline-flex items-center px-6 py-3 bg-red-600 text-white font-bold rounded-lg shadow-md hover:bg-red-700 transition-colors transform hover:scale-105"
              >
                Logout
              </button>
            </div>
          </div>
        </div>
      );
    };

    function AuthForm({ onLoginSuccess }) {
      const [isLogin, setIsLogin] = useState(true);
      const [loginId, setLoginId] = useState(''); // Can be email or phone number
      const [password, setPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState(''); // New state for confirm password
      const [message, setMessage] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const handleToggle = () => {
        setIsLogin(!isLogin);
        setMessage('');
        setLoginId('');
        setPassword('');
        setConfirmPassword(''); // Clear confirm password on toggle
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setMessage('');

        // Client-side validation for password confirmation
        if (!isLogin && password !== confirmPassword) {
          setMessage('Passwords do not match.');
          return;
        }

        setIsLoading(true);

        const url = `http://localhost:5000/${isLogin ? 'login' : 'register'}`;
        let postData = {
          password: password
        };

        // Determine if the input is an email or a phone number
        if (loginId.includes('@')) {
          postData.email = loginId;
          postData.phoneNumber = null; // Ensure phone number is null if email is provided
        } else {
          postData.phoneNumber = loginId;
          postData.email = null; // Ensure email is null if phone number is provided
        }

        try {
          const response = await axios.post(url, postData);
          setMessage(`✅ ${response.data.message}`);
          if (isLogin) {
            onLoginSuccess();
          }
        } catch (error) {
          if (error.response) {
            setMessage(`❌ ${error.response.data.message || 'Something went wrong.'}`);
          } else {
            setMessage(`❌ Network error. Please check your connection or server.`);
          }
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="flex items-center justify-center min-h-screen p-4">
          <div className="w-full max-w-sm px-8 py-10 bg-white bg-opacity-80 rounded-xl shadow-lg border border-gray-200">
            <h1 className="text-3xl font-bold text-center text-gray-900 mb-6">
              {isLogin ? 'Login' : 'Register'}
            </h1>
            <form onSubmit={handleSubmit}>
              <div className="mb-6">
                <label className="block text-gray-700 font-semibold mb-2" htmlFor="loginId">
                  Email or Phone Number
                </label>
                <input
                  type="text"
                  id="loginId"
                  value={loginId}
                  onChange={(e) => setLoginId(e.target.value)}
                  className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  placeholder="Enter email or phone number"
                  required
                />
              </div>
              <div className="mb-6">
                <label className="block text-gray-700 font-semibold mb-2" htmlFor="password">
                  Password
                </label>
                <input
                  type="password"
                  id="password"
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  required
                />
              </div>
              {!isLogin && (
                <div className="mb-6">
                  <label className="block text-gray-700 font-semibold mb-2" htmlFor="confirmPassword">
                    Confirm Password
                  </label>
                  <input
                    type="password"
                    id="confirmPassword"
                    value={confirmPassword}
                    onChange={(e) => setConfirmPassword(e.target.value)}
                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required
                  />
                </div>
              )}
              <button
                type="submit"
                disabled={isLoading}
                className={`w-full py-3 font-bold rounded-lg transition-colors ${isLoading ? 'bg-gray-400 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}`}
              >
                {isLoading ? 'Loading...' : isLogin ? 'Login' : 'Sign Up'}
              </button>
            </form>

            {message && (
              <div className={`mt-6 text-center text-sm font-semibold p-3 rounded-lg ${message.startsWith('✅') ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                {message}
              </div>
            )}

            <div className="mt-6 text-center text-gray-600">
              <span>
                {isLogin ? "Don't have an account?" : "Already have an account?"}{' '}
                <button
                  onClick={handleToggle}
                  className="text-blue-600 font-bold hover:text-blue-700 transition-colors"
                >
                  {isLogin ? 'Register' : 'Login'}
                </button>
              </span>
            </div>
          </div>
        </div>
      );
    }

    const App = () => {
      const [isAuthenticated, setIsAuthenticated] = useState(false);

      const handleLoginSuccess = () => {
        setIsAuthenticated(true);
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
      };

      return isAuthenticated ? (
        <BusinessCard onLogout={handleLogout} />
      ) : (
        <AuthForm onLoginSuccess={handleLoginSuccess} />
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
